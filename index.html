<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platformer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth" id="auth" hidden>
    <form class="auth__panel" id="auth-form" novalidate>
      <h1 class="auth__title">Platformer</h1>
      <p class="auth__mode">Log in or sign up</p>
      <label class="auth__field">
        <span class="auth__label">Username</span>
        <input class="auth__input" id="auth-username" type="text"
               autocomplete="username" required>
      </label>
      <label class="auth__field">
        <span class="auth__label">Password</span>
        <input class="auth__input" id="auth-password" type="password"
               autocomplete="current-password" required>
      </label>
      <label class="auth__field auth__field--reveal"
             id="auth-confirm-field" hidden>
        <span class="auth__label">Confirm password</span>
        <input class="auth__input" id="auth-confirm" type="password"
               autocomplete="new-password">
      </label>
      <div class="auth__actions">
        <button class="auth__button is-primary" id="auth-login"
                type="button">Log in</button>
        <button class="auth__button" id="auth-signup"
                type="button">Sign up</button>
      </div>
      <p class="auth__message" id="auth-message"></p>
    </form>
  </section>

  <div class="app" hidden>
  <div class="corner">
    <span class="corner__version">v1.33.0</span>
    <span class="corner__player" data-player></span>
    <div class="corner__actions">
      <button class="button button--secondary" type="button" data-action="fullscreen">Fullscreen</button>
    </div>
  </div>

  <main class="stage">
    <section class="screen screen--wide is-active" data-screen="play">
      <p class="label">Main menu</p>
      <h1 class="title">Platformer</h1>

      <div class="chips tabs" role="group" aria-label="Sections">
        <button class="chip is-active" type="button" data-tab="play">Play</button>
        <button class="chip" type="button" data-tab="runs">Recent runs</button>
      </div>

      <div data-panel="play">

      <article class="seed">
        <div class="seed__group">
          <p class="label">Seed</p>
          <div class="chips" role="group" aria-label="Seed source">
            <button class="chip is-active" type="button" data-source="custom" aria-pressed="true">Custom</button>
            <button class="chip" type="button" data-source="daily" aria-pressed="false">Daily</button>
            <button class="chip" type="button" data-source="random" aria-pressed="false">Random</button>
          </div>
          <input class="seed__input" type="text" data-seed aria-label="Seed"
                 autocomplete="off" spellcheck="false" maxlength="32">
          <p class="seed__resolved" data-resolved></p>
        </div>

        <div class="seed__group">
          <p class="label">Run length</p>
          <div class="chips" role="group" aria-label="Run length">
            <button class="chip is-active" type="button" data-mode="1k" aria-pressed="true">1000 m</button>
            <button class="chip" type="button" data-mode="2k" aria-pressed="false">2 km</button>
            <button class="chip" type="button" data-mode="5k" aria-pressed="false">5 km</button>
            <button class="chip" type="button" data-mode="10k" aria-pressed="false">10 km</button>
          </div>
        </div>
      </article>

      <div class="actions">
        <button class="button button--primary" type="button" data-action="play">Play</button>
        <button class="button button--secondary" type="button" data-action="tutorial">Tutorial</button>
      </div>

      <p class="label controls__label">Controls</p>
      <div class="chips" role="group" aria-label="Control scheme">
        <button class="chip is-active" type="button" data-scheme="modern" aria-pressed="true">Modern</button>
        <button class="chip" type="button" data-scheme="retro" aria-pressed="false">Retro Arcade</button>
      </div>
      <dl class="controls" data-controls></dl>
      </div>

      <div data-panel="runs" hidden>
        <ol class="runs" data-runs-list></ol>
        <p class="runs__note" data-runs-note>No runs yet</p>
      </div>
    </section>
  </main>

  <div class="loader" data-loader hidden>
    <div class="loader__panel">
      <p class="label">Loading</p>
      <p class="loader__stage" data-stage>Hashing seed</p>
      <div class="loader__track"><span class="loader__fill" data-fill></span></div>
      <p class="loader__meta" data-loader-meta></p>
    </div>
  </div>

  <div class="game" data-game hidden>
    <canvas class="game__canvas" data-game-canvas></canvas>
    <div class="game__hud">
      <p class="game__seed" data-hud-seed></p>
      <p class="game__distance" data-hud-distance></p>
    </div>
    <button class="button button--secondary game__quit" type="button" data-action="quit">Quit</button>

    <div class="lesson lesson--victory" data-victory hidden>
      <div class="lesson__card">
        <p class="label">Run complete</p>
        <h2 class="lesson__title" data-victory-title>Through the door</h2>
        <dl class="victory" data-victory-stats></dl>
        <p class="lesson__hint">Saved to your Runs history.</p>
        <button class="button button--primary" type="button" data-action="continue">Continue — Space</button>
      </div>
    </div>

    <div class="lesson" data-lesson hidden>
      <div class="lesson__card">
        <p class="label" data-lesson-step></p>
        <h2 class="lesson__title" data-lesson-title></h2>
        <p class="lesson__body" data-lesson-body></p>
        <p class="lesson__hint" data-lesson-hint></p>
        <button class="button button--primary" type="button" data-action="resume">Got it — Space</button>
      </div>
    </div>
  </div>
  </div>

  <script src="js/rng.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/level.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/runs.js"></script>
  <script src="script.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
